name: Deploy to GitHub Pages

on:
  push:
    # dev deploys the staging/preview Pages site; master is production.
    branches: [master, dev]
  # Weekly rebuild so date-scheduled blog posts auto-publish once their date passes.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Node version
        id: nvm
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Build Astro site
        uses: withastro/action@v6
        with:
          node-version: ${{ steps.nvm.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
